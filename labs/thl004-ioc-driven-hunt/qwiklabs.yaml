schema_version: 2
default_locale: en
title: IOC-Driven Threat Hunting and Behavioral Detection
description: Practice IOC-driven threat hunting by enriching indicators of compromise
  (IP, domain, hash, user, OAuth client) using Elasticsearch telemetry. Pivot across
  network, DNS, authentication, and workload logs in Kibana to uncover related activity
  and expand investigations beyond initial IOC matches. Develop hypothesis-driven
  hunts to identify attacker behaviors such as command-and-control, privilege escalation,
  and lateral movement. Transform IOC findings into behavioral detection logic aligned
  with MITRE ATT&CK.
instruction:
  type: md
  uri: instructions/lab_4.md
duration: 120
max_duration: 120
credits: 0
level: fundamental
