schema_version: 2
default_locale: en
title: Workspace Data Exfiltration Investigation
description: Investigate a SaaS-based attack chain involving phishing, account compromise,
  and data exfiltration in a Google Workspace–like environment using Kibana and Elasticsearch.
  Analyze email, OAuth, admin audit, and Drive activity logs to identify phishing
  delivery, detect credential or token abuse, uncover mailbox rule persistence, and
  trace file access and external data transfer. Correlate multi-source telemetry to
  reconstruct a complete attack timeline aligned with MITRE ATT&CK techniques.
