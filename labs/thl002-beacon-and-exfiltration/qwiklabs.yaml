schema_version: 2
default_locale: en
title: Beacon and Exfiltration
description: Investigate covert C2 beaconing and cloud data exfiltration using Kibana
  and preloaded network, DNS, workload, and storage audit logs. Correlate multi-source
  telemetry to reconstruct a stealthy attack timeline aligned to MITRE ATT&CK.
